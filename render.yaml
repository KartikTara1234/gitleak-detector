# One-click deploy on Render (https://render.com): New → Blueprint → point at this repo.
services:
  - type: web
    name: repo-secret-sweeper
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false   # paste your Atlas URI in the dashboard, or leave unset for in-memory history
